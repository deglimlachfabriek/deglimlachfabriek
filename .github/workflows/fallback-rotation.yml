name: Dagelijkse rotatie (terugvaloptie)

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Draai de generator
        run: node scripts/rotation_generate.mjs

      - name: Commit gegenereerd bestand
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add _data/daily.json || true
            git commit -m "chore: rotate daily fallback inspiration" || true
            git push
          else
            echo "Geen wijzigingen om door te voeren"
          fi

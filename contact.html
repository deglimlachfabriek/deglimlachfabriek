<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — De Glimlachfabriek</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .contact-container { max-width: 600px; margin: 40px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); color: #333; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #1f2937; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 5px; font-size: 1em; }
        .btn-submit { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1em; }
        .btn-submit:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <h1>De Glimlachfabriek</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="dagelijkse-hoop.html">Dagelijkse Hoop</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="contact-container">
            <h2>🤝 Neem Contact Op</h2>
            <p>Bent u geïnteresseerd om partner of sponsor te worden van Beanbot of De Glimlachfabriek? Vul het formulier in en we nemen zo snel mogelijk contact met u op.</p>
            
            <form action=" https://formspree.io/f/mvkzeypl" method="POST">
                <div class="form-group">
                    <label for="name">Naam / Bedrijf:</label>
                    <input type="text" id="name" name="name" required placeholder="Uw naam of bedrijfsnaam">
                </div>
                <div class="form-group">
                    <label for="email">E-mailadres:</label>
                    <input type="email" id="email" name="_replyto" required placeholder="uw@email.com">
                </div>
                <div class="form-group">
                    <label for="message">Bericht:</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Wat kunnen we voor elkaar betekenen?"></textarea>
                </div>
                <button type="submit" class="btn-submit">Verzend Bericht</button>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2026 De Glimlachfabriek — Dromen • Denken • Doen</p>
    </footer>

</body>
</html>
